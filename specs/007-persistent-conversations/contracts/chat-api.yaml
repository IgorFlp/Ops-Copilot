openapi: 3.1.0
info:
  title: OpsCopilot Chat API
  version: 1.1.0
paths:
  /chat:
    post:
      summary: Run an operational reasoning strategy in a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              newConversation:
                summary: Start a new conversation
                value:
                  message: "What critical alerts are firing?"
              continueConversation:
                summary: Continue an existing conversation
                value:
                  message: "What changed since the previous check?"
                  conversationId: "conv_9c9138a7f64d4b8cb63bf8be"
      responses:
        "200":
          description: The reasoning result and conversation identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResult"
        "400":
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: The supplied conversation identifier does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
        "422":
          description: The strategy name is not registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
        "500":
          description: Persistence, strategy execution, or reflection failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
        "504":
          description: Strategy execution exceeded the existing deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
components:
  schemas:
    ChatRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character.
        strategy:
          type: string
          default: react
          description: A registered base strategy name.
          examples:
            - react
            - plan-and-execute
        reflect:
          type: boolean
          default: false
          description: Apply reflection to the selected base strategy.
        conversationId:
          type: string
          minLength: 1
          description: Existing conversation to continue; omit to start a new one.
    ChatResult:
      type: object
      additionalProperties: false
      required:
        - answer
        - trace
        - metrics
        - conversationId
      properties:
        answer:
          type: string
        trace:
          type: array
          items:
            $ref: "#/components/schemas/TraceEvent"
        metrics:
          $ref: "#/components/schemas/Metrics"
        conversationId:
          type: string
          minLength: 1
    TraceEvent:
      type: object
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum:
            - thought
            - action
            - observation
            - plan
            - critique
            - answer
        content:
          type: string
        timestamp:
          type: string
        tools:
          type: array
          items:
            type: string
        args:
          type: object
          additionalProperties: true
        approved:
          type: boolean
    Metrics:
      type: object
      required:
        - calls
        - latencyMs
        - historyMessages
      properties:
        calls:
          type: integer
          minimum: 0
        latencyMs:
          type: number
          minimum: 0
        historyMessages:
          type: integer
          minimum: 0
          description: Number of prior messages included, bounded by HISTORY_MESSAGES_THRESHOLD (default 12).
    ValidationError:
      type: object
      required:
        - error
        - issues
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            type: object
            required:
              - path
              - message
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string
    ChatError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
